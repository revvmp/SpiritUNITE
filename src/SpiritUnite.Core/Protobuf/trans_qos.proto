syntax = "proto2";

package trans_qos;

option csharp_namespace = "SpiritUnite.Network.GVoice.Messages";

message RoomInfo {
  optional bytes app_identity = 1;
  optional bytes room_name = 2;
  optional uint64 room_id = 3;
}

message ClientMemberInfo {
  optional uint32 status = 1;
}

message SynMemberInfo {
  optional bytes open_id = 1;
  optional uint64 member_id = 2;
  optional bytes client_private_info = 3;
  optional uint32 action = 4;
}

message ClientReportReq {
  optional RoomInfo room_info = 1;
  optional SynMemberInfo member_info = 2;
  optional uint32 version = 3;
  optional uint32 want_member_id = 4;
}

message SynchronizeMemInfoReq {
  optional RoomInfo room_info = 1;
  repeated SynMemberInfo member_infos = 2;
  optional uint32 version = 3;
}

message SynchronizeMemInfoRsp {
  optional RoomInfo room_info = 1;
  optional uint32 version = 2;
}

message QosMsg {
  optional ClientReportReq client_report_req = 6;
  optional SynchronizeMemInfoReq synchronize_mem_info_req = 7;
  optional SynchronizeMemInfoRsp synchronize_mem_info_rsp = 8;
}
